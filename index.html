<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c0392b">
  <title>Spanska</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Sätt ljust/mörkt läge direkt, innan sidan ritas (ingen blinkning).
    // Har du inte valt själv används enhetens inställning.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem("app.theme")); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      var a = null;
      try { a = JSON.parse(localStorage.getItem("app.anim")); } catch (e) {}
      if (a !== "on" && a !== "off") a = matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on";
      document.documentElement.dataset.anim = a;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button id="btnHome" class="icon-btn" title="Tillbaka" aria-label="Tillbaka">⌂</button>
    <button id="btnMenu" class="icon-btn" title="Konfigar" aria-label="Konfigar">☰</button>
    <h1><span class="title-row"><span id="title">¡Hola! Spanska</span> <small id="version" class="version"></small> <small id="syncState" class="sync-state"></small></span>
      <button id="cfgBadge" class="cfg-badge" type="button" title="Byt konfig"></button></h1>
    <button id="btnSettings" class="icon-btn" title="Inställningar" aria-label="Inställningar">⚙</button>
    <button id="btnFull" class="icon-btn" title="Helskärm" aria-label="Helskärm">⛶</button>
  </header>

  <main id="view"></main>
  <div id="toast" class="toast"></div>

  <!-- ☰ Konfig-menyn -->
  <div id="drawerBg" class="drawer-bg"></div>
  <aside id="drawer" class="drawer" aria-label="Konfigar">
    <div class="drawer-head">
      <b>Konfigar</b>
      <button id="btnCloseDrawer" class="icon-btn" title="Stäng" aria-label="Stäng">✕</button>
    </div>
    <p class="muted small drawer-help">Varje konfig är ett språk eller ett ämne med egna kort och egen progress.</p>
    <ul id="configList" class="config-list"></ul>
    <button id="btnNewConfig" class="btn good drawer-new">＋ Skapa ny konfig</button>
  </aside>

  <!-- Startsida -->
  <template id="tpl-home">
    <section class="home">
      <div id="homeMascot" class="home-mascot"></div>
      <div class="stats-panel">
        <div class="level-row">
          <span id="lvlBadge" class="level-badge" title="Din nivå">1</span>
          <div class="xp-wrap">
            <div class="xp-text"><b id="lvlName">Nivå 1</b><span id="xpText" class="muted"></span></div>
            <div class="xp-bar"><i id="xpBar"></i></div>
            <small id="xpNext" class="muted"></small>
          </div>
        </div>
        <div class="counters">
          <div class="counter" title="Kort du har övat på minst en gång">
            <span class="c-icon">📚</span><b id="cntStudied">0</b><small>kort övade</small>
          </div>
          <div class="counter gold" title="Kort som nått högsta nivån (5 rätt i rad)">
            <span class="c-icon">🏆</span><b id="cntMastered">0</b><small>fullt inlärda</small>
          </div>
        </div>
        <div class="daily-row">
          <div class="streak-chip" title="Dagar i rad som du har övat">
            <span class="flame">🔥</span><b id="streakNum">0</b><small id="streakTxt">dagar i rad</small>
          </div>
          <button id="btnGoal" class="goal" title="Dagsmål – tryck för att ändra">
            <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="goal-bg" cx="22" cy="22" r="18"></circle>
              <circle id="goalArc" class="goal-arc" cx="22" cy="22" r="18"></circle></svg>
            <span class="goal-text"><b id="goalNum">0/20</b><small>idag 🎯</small></span>
          </button>
          <button id="btnAch" class="btn-small ach-btn">🏅 Märken<br>&amp; statistik</button>
        </div>
        <small id="statsScope" class="muted stats-scope"></small>
      </div>
      <button id="btnAdventure" class="pm-adventure home">
        <span class="adv-icon-wrap"><svg class="adv-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M12 50 L27 33 L40 42 L53 14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/>
            <circle cx="12" cy="50" r="7.5" fill="#2fb344" stroke="#fff" stroke-width="2.5"/>
            <circle cx="27" cy="33" r="7.5" fill="#1c9be6" stroke="#fff" stroke-width="2.5"/>
            <circle cx="40" cy="42" r="7.5" fill="#f1c40f" stroke="#fff" stroke-width="2.5"/>
            <circle cx="53" cy="14" r="7.5" fill="#e0479e" stroke="#fff" stroke-width="2.5"/></svg></span>
        <span class="pm-adv-text"><b>Äventyr</b><small>Fortsätt där du var</small></span>
        <span class="pm-adv-go">▶</span>
      </button>
      <div class="practice-row home-practice">
        <button id="btnHomePractice" class="kd-btn play btn-practice go-blue"><span class="kd-btn-icon" data-ic="play"></span><span class="kd-btn-text"><b>Öva</b><small id="homePracticeSub">Alla dina kort</small></span><span class="kd-btn-go" data-ic="arrow"></span></button>
      </div>
      <button id="btnMyCards" class="deck-btn mine">
        <b>📒 Mina kort</b>
        <span id="myCardsInfo" class="muted"></span>
        <div class="bar"><i id="myCardsBar"></i></div>
      </button>
      <button id="btnKortlekar" class="kl-quick home-kl">
        <span class="kl-quick-stack" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="kl-quick-text"><b>Kortlekar</b><small id="klHomeInfo">Dela upp korten i lekar och underlekar</small></span>
        <span class="kl-quick-go" data-ic="arrow"></span>
      </button>
      <p class="lead">Färdiga övningslekar</p>
      <div id="deckList" class="deck-list"></div>
      <div class="home-actions">
        <button id="btnUpdate" class="btn ghost">🔄 Uppdatera appen</button>
      </div>
    </section>
  </template>

  <!-- Mina kort: lägg till, lista, filter -->
  <template id="tpl-mycards">
    <section class="mycards">
      <div class="cat-bar">
        <label class="cat-label">📁
          <select id="catSel" aria-label="Kategori"></select>
        </label>
        <button id="btnCats" class="btn-small" type="button">Hantera kategorier</button>
      </div>
      <p id="catHint" class="muted small cat-hint"></p>
      <div class="practice-row">
        <button id="btnPractice" class="kd-btn play btn-practice go-blue"><span class="kd-btn-icon" data-ic="play"></span><span class="kd-btn-text"><b>Öva</b><small id="practiceSub">Korten som visas i listan</small></span><span class="kd-btn-go" data-ic="arrow"></span></button>
      </div>
      <p id="practiceInfo" class="muted small center">Övningen använder korten som visas i listan just nu.</p>
      <button id="btnToKortlekar" class="kl-quick">
        <span class="kl-quick-stack" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="kl-quick-text"><b>Kortlekar</b><small id="klMyInfo">Lekar och underlekar med dina kort</small></span>
        <span class="kl-quick-go" data-ic="arrow"></span>
      </button>
      <form id="addForm" class="add-form" autocomplete="off">
        <div class="add-cols">
          <label><span id="lblSv">Svenska</span><input id="inSv" type="text" lang="sv" placeholder="t.ex. att hjälpa" spellcheck="false"></label>
          <label><span id="lblEs">Español</span><input id="inEs" type="text" lang="es" placeholder="t.ex. ayudar" spellcheck="false" autocapitalize="off"></label>
        </div>
        <div class="accents" data-target="inEs"></div>
        <div class="add-row">
          <button class="btn good" type="submit">＋ Lägg till</button>
          <span id="aiStatus" class="ai-status"></span>
        </div>
        <p id="addHelp" class="muted small">Skriv i en ruta eller båda. Tom ruta fylls i automatiskt. Stavfel markeras gult så du kan rätta dem sen.</p>
      </form>
      <button id="btnPhoto" class="kd-btn photo-btn" type="button"><span class="kd-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 10.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z"/></svg></span><span class="kd-btn-text"><b>Från bild</b><small>Fota boken eller anteckningar – gör kort, sammanfatta eller få svar</small></span><span class="kd-btn-go" data-ic="arrow"></span></button>
      <button id="btnImport" class="btn import-btn">Importera flashcards från text 📋</button>

      <div class="search-row">
        <label class="search-box"><span aria-hidden="true">🔍</span>
          <input id="cardSearch" type="search" placeholder="Sök bland korten (fråga och svar)…" autocomplete="off" spellcheck="false" aria-label="Sök bland korten">
        </label>
        <button id="btnDupes" class="btn-small dupes-btn" type="button" title="Låt AI:n leta efter kort som är dubletter">🤖 Hitta dubletter</button>
      </div>
      <div class="filters" id="filters">
        <button data-filter="all" class="chip active">Alla</button>
        <button data-filter="warn" class="chip yellow">🟡 Att rätta</button>
        <button data-filter="known" class="chip green">🟢 Kan</button>
        <button data-filter="never" class="chip">⚪ Aldrig övade</button>
        <button data-filter="hard" class="chip red">🔴 Svåra</button>
        <button data-filter="unchecked" class="chip">⏳ Ej kontrollerade</button>
        <button data-filter="noai" class="chip">🤖 Inte av AI</button>
      </div>
      <div class="list-tools">
        <label>Sortera
          <select id="sortSel">
            <option value="new">Nyast först</option>
            <option value="never">Aldrig övade först</option>
            <option value="practiced">Mest övade först</option>
            <option value="wrong">Flest fel först</option>
            <option value="sv">Svenska A–Ö</option>
            <option value="es">Español A–Z</option>
          </select>
        </label>
        <span id="listCount" class="muted"></span>
        <button id="btnAiAll" class="btn-small hidden"></button>
      </div>

      <ul id="cardList" class="card-list"></ul>
    </section>
  </template>

  <!-- Importera från text -->
  <template id="tpl-import">
    <section class="import">
      <h2>Importera flashcards från text 📋</h2>
      <p class="muted">Klistra in en text, till exempel från läroboken eller en uppgift. AI:n plockar ut de viktiga
        begreppen, och sen sveper du höger på de kort du vill ha.</p>
      <p id="importCat" class="muted small"></p>
      <textarea id="importText" rows="12" placeholder="Klistra in texten här…" spellcheck="false"></textarea>
      <p id="importCount" class="muted small"></p>
      <div class="row">
        <button id="btnClearText" class="btn ghost">🧹 Rensa</button>
        <button id="btnSubmitText" class="btn good">Skicka ✓</button>
      </div>
      <p id="importStatus" class="muted center"></p>
    </section>
  </template>

  <!-- Svep-korten -->
  <template id="tpl-swipe">
    <section class="swipe">
      <p id="swipeInfo" class="muted center"></p>
      <div id="swipeStack" class="swipe-stack"></div>
      <div class="swipe-buttons">
        <button id="btnSwipeNo" class="round no" title="Hoppa över (←)">✗</button>
        <button id="btnSwipeUndo" class="round undo" title="Ångra">↶</button>
        <button id="btnSwipeYes" class="round yes" title="Lägg till (→)">♥</button>
      </div>
      <p class="muted small center">Svep höger för att lägga till, vänster för att hoppa över.</p>
    </section>
  </template>

  <template id="tpl-swipe-done">
    <section class="done">
      <div class="big">📒</div>
      <h2 id="swipeDoneTitle"></h2>
      <p id="swipeDoneText" class="muted"></p>
      <div class="row">
        <button id="btnToMyCards" class="btn good">Till Mina kort</button>
        <button id="btnImportMore" class="btn secondary">Importera mer</button>
      </div>
    </section>
  </template>

  <!-- Färdig lek -->
  <template id="tpl-deck">
    <section class="deck">
      <h2 id="deckName"></h2>
      <p id="deckStats" class="muted"></p>
      <div class="mode-grid">
        <button class="mode" data-mode="practice"><span>▶</span>Öva<small>Välj hur du vill öva</small></button>
        <button class="mode" data-mode="list"><span>📋</span>Ordlista<small>Se och lyssna</small></button>
      </div>
      <button id="btnCopyDeck" class="btn ghost">Kopiera lekens ord till Mina kort</button>
      <button id="btnUnhide" class="btn ghost hidden"></button>
    </section>
  </template>

  <template id="tpl-cards">
    <section class="cards">
      <div class="practice-head"><p id="progress" class="muted"></p><span id="combo" class="combo hidden"></span>
      <div class="practice-tools">
        <button id="btnMark" class="tool" title="Gulmarkera kortet">🟡 <span>Gulmarkera</span></button>
        <button id="btnTrash" class="tool" title="Ta bort kortet">🗑 <span>Ta bort</span></button>
      </div>
      </div>
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="card-stage">
        <div id="card" class="flipcard" tabindex="0" role="button" aria-label="Vänd kortet">
          <div class="flipcard-inner">
            <div class="card-face face-front">
              <small id="cardLang" class="lang-tag"></small>
              <div id="cardFront" class="card-text"></div>
              <small class="hint">Tryck för att vända</small>
            </div>
            <div class="card-face face-back">
              <small id="cardLangBack" class="lang-tag"></small>
              <div id="cardQ" class="card-q"></div>
              <div id="cardBack" class="card-text back"></div>
              <small class="hint">Tryck för att vända tillbaka</small>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <button id="btnSpeak" class="btn secondary">🔊 Lyssna</button>
      </div>
      <div id="answerRow" class="row hidden">
        <button id="btnWrong" class="btn bad">✗ Kunde inte</button>
        <button id="btnRight" class="btn good">✓ Kunde</button>
      </div>
    </section>
  </template>

  <template id="tpl-write">
    <section class="write">
      <div class="practice-head"><p id="progress" class="muted"></p><span id="combo" class="combo hidden"></span>
      <div class="practice-tools">
        <button id="btnMark" class="tool" title="Gulmarkera kortet">🟡 <span>Gulmarkera</span></button>
        <button id="btnTrash" class="tool" title="Ta bort kortet">🗑 <span>Ta bort</span></button>
      </div>
      </div>
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="card static">
        <small id="promptLang" class="lang-tag"></small>
        <div id="prompt" class="card-text"></div>
      </div>
      <form id="writeForm" class="write-form" autocomplete="off">
        <input id="answer" type="text" autocapitalize="off" spellcheck="false">
        <div class="accents" data-target="answer"></div>
        <button class="btn good" type="submit">Rätta</button>
      </form>
      <div id="feedback" class="feedback hidden"></div>
      <div class="row"><button id="btnNext" class="btn secondary hidden">Nästa →</button></div>
    </section>
  </template>

  <!-- Svårt läge: bara flashcards och skrivfrågor -->
  <template id="tpl-hard">
    <section class="hard">
      <div class="practice-head"><p id="progress" class="muted"></p><span id="combo" class="combo hidden"></span>
      <div class="practice-tools">
        <button id="btnMark" class="tool" title="Gulmarkera kortet">🟡 <span>Gulmarkera</span></button>
        <button id="btnTrash" class="tool" title="Ta bort kortet">🗑 <span>Ta bort</span></button>
      </div>
      </div>
      <div class="pbar"><i id="pbarFill"></i></div>
      <div class="card static hard-card">
        <small id="promptLang" class="lang-tag"></small>
        <span id="hardKind" class="hard-kind"></span>
        <button id="btnSpeakQ" class="sc-speak" title="Lyssna">🔊</button>
        <div id="prompt" class="card-text"></div>
      </div>
      <div id="hardFlash" class="hard-flash hidden">
        <button id="btnReveal" class="btn good hard-reveal">👀 Visa svaret</button>
        <div id="hardAnswer" class="card static hard-answer hidden"><small id="answerLang" class="lang-tag"></small><div id="answerText" class="card-text"></div></div>
        <div id="selfRow" class="row hidden">
          <button id="btnSelfNo" class="btn bad">✗ Kunde inte</button>
          <button id="btnSelfYes" class="btn good">✓ Kunde</button>
        </div>
      </div>
      <form id="hardForm" class="write-form hard-form hidden" autocomplete="off">
        <textarea id="hardInput" rows="1" autocapitalize="off" spellcheck="false"></textarea>
        <div class="accents" data-target="hardInput"></div>
        <button id="btnGrade" class="btn good" type="submit">Rätta</button>
      </form>
      <div id="feedback" class="feedback hidden"></div>
      <div id="judgeRow" class="row hidden">
        <button id="btnJudgeNo" class="btn bad">✗ Jag hade fel</button>
        <button id="btnJudgeYes" class="btn good">✓ Jag hade rätt</button>
      </div>
      <div class="row"><button id="btnNext" class="btn secondary hidden">Nästa →</button></div>
    </section>
  </template>

  <!-- Dubletter som AI:n har hittat -->
  <template id="tpl-dupes">
    <section class="dupes">
      <p id="dupInfo" class="muted"></p>
      <div class="row tight"><button id="btnDupScan" class="btn secondary">🤖 Skanna igen</button></div>
      <div class="dup-head"><span>Kort 1</span><span>Kort 2</span></div>
      <div id="dupList" class="dup-list"></div>
    </section>
  </template>

  <!-- Kortlekar -->
  <template id="tpl-kl">
    <section class="kl">
      <div id="klHero" class="kl-hero">
        <span class="kl-blob b1"></span><span class="kl-blob b2"></span><span class="kl-blob b3"></span>
        <span id="klHeroIcon" class="kl-hero-icon"></span>
        <div class="kl-hero-text"><h2 id="klHeroTitle"></h2><p id="klHeroSub"></p></div>
      </div>
      <div id="klGrid" class="kl-grid"></div>
    </section>
  </template>

  <!-- En kortlek -->
  <template id="tpl-kl-deck">
    <section class="kd">
      <nav id="kdCrumbs" class="kd-crumbs"></nav>
      <div id="kdHero" class="kl-hero kd-hero">
        <span class="kl-blob b1"></span><span class="kl-blob b2"></span><span class="kl-blob b3"></span>
        <div class="kd-hero-main">
          <span id="kdIcon" class="kl-hero-icon"></span>
          <div class="kl-hero-text">
            <h2 id="kdName"></h2>
            <span id="kdKind"></span>
            <p id="kdDesc"></p>
          </div>
          <div id="kdRing"></div>
        </div>
        <div id="kdNums" class="kd-nums"></div>
      </div>
      <div class="kd-actions">
        <button id="kdPractice" class="kd-btn play"><span class="kd-btn-icon" data-ic="play"></span><span><b>Öva kortleken</b><small></small></span></button>
        <button id="kdImport" class="kd-btn import"><span class="kd-btn-icon" data-ic="download"></span><span><b>Importera kort från Mina kort</b><small>Välj kort med plusknappen</small></span></button>
        <button id="kdNewSub" class="kd-btn sub"><span class="kd-btn-icon" data-ic="plus"></span><span><b>Ny underkortlek</b><small>Med egen typ, färg och ikon</small></span></button>
        <button id="kdEdit" class="kd-btn edit"><span class="kd-btn-icon" data-ic="pen"></span><span><b>Ändra leken</b><small>Namn, typ, färg – eller ta bort</small></span></button>
      </div>
      <h3 id="kdSubsHead" class="kd-h"><span class="kd-h-ic" data-ic="layers"></span>Underkortlekar</h3>
      <div id="kdSubs" class="kl-grid subs"></div>
      <h3 class="kd-h"><span class="kd-h-ic" data-ic="book"></span><span id="kdCardsHead"></span></h3>
      <ul id="kdCards" class="kd-cards"></ul>
    </section>
  </template>

  <!-- Skapa / ändra kortlek -->
  <template id="tpl-kl-edit">
    <section class="ke">
      <h2 id="keHead"></h2>
      <div id="kePreview" class="ke-preview"></div>
      <label class="field">Namn<input id="keName" type="text" maxlength="40"></label>
      <div class="field">Vad innehåller leken? <small class="muted">Övningen anpassas efter det. Flashcards är som vanligt.</small></div>
      <div id="keKinds" class="ke-kinds"></div>
      <div class="field">Färg</div>
      <div id="keColors" class="ke-colors"></div>
      <div class="field">Ikon</div>
      <div id="keIcons" class="ke-icons"></div>
      <div class="ke-row">
        <button id="keSave" class="kd-btn play ke-save"><span class="kd-btn-icon" data-ic="check"></span><span><b>Spara kortleken</b></span></button>
        <button id="keDelete" class="btn bad hidden">🗑 Ta bort</button>
      </div>
    </section>
  </template>

  <!-- Bakgrund -->
  <template id="tpl-bg">
    <section class="bgv">
      <div class="setting-row bg-original">
        <span class="setting-text"><b>🏠 Original bakgrund</b><small class="muted">På: appens vanliga bakgrund. Av: din egen bakgrund nedan. Dina val sparas så att du kan byta fram och tillbaka.</small></span>
        <label class="switch"><input id="bgOriginal" type="checkbox" role="switch" aria-label="Original bakgrund"><span class="slider"></span></label>
      </div>
      <div id="bgPreview" class="bg-preview">
        <div class="bgp-fill"></div>
        <div class="bgp-bar"></div>
        <div class="bgp-card c1"></div><div class="bgp-card c2"></div><div class="bgp-card c3"></div>
        <span class="bgp-label">Förhandsvisning</span>
      </div>

      <div class="setting-row bg-scope">
        <span class="setting-text"><b>🎯 Bara den här konfigen</b><small id="bgScopeText" class="muted"></small></span>
        <label class="switch"><input id="bgScope" type="checkbox" role="switch" aria-label="Bara den här konfigen"><span class="slider"></span></label>
      </div>

      <h3 class="bg-h">Färdiga bakgrunder</h3>
      <div id="bgPresets" class="bg-presets"></div>

  <template id="tpl-adv">
    <section class="adv">
      <div class="adv-stats">
        <span class="adv-stat streak" title="Dagar i rad">🔥 <b id="advStreak">0</b></span>
        <span class="adv-stat level" title="Nivå och XP till nästa nivå">⭐ <b id="advLevel">1</b><span class="adv-xpbar"><i id="advXPBar"></i></span></span>
        <span class="adv-stat xp" title="Total XP">⚡ <b id="advXP">0</b></span>
        <span class="adv-stat goal" title="Dagens mål">🎯 <b id="advGoal">0/20</b></span>
        <span class="adv-stat coins" title="Mynt">🪙 <b id="advCoins">0</b></span>
      </div>
      <div id="advPath" class="adv-path"></div>
    </section>
  </template>

  <!-- Äventyr: lektion -->
  <template id="tpl-adv-lesson">
    <section class="adv-lesson-view">
      <div class="adv-top">
        <button id="advQuit" class="adv-x" title="Avsluta" aria-label="Avsluta">✕</button>
        <div class="adv-progress"><i id="advBar"></i></div>
        <span id="advHearts" class="adv-hearts hidden"></span>
        <button id="advAudio" class="adv-toggle" aria-label="Ljud av/på">🔊</button>
        <button id="advMic" class="adv-toggle" aria-label="Mikrofon av/på">🎤</button>
      </div>
      <span id="combo" class="combo hidden adv-combo"></span>
      <div id="advBody" class="adv-body"></div>
      <div class="adv-footer">
        <div id="advSheet" class="adv-sheet"></div>
        <button id="advCheck" class="adv-btn big" disabled>KONTROLLERA</button>
      </div>
    </section>
  </template>

  <!-- Äventyr: klart -->
  <template id="tpl-adv-done">
    <section class="adv-done">
      <div id="advDoneFig" class="adv-done-fig">🦎</div>
      <h2 id="advDoneTitle"></h2>
      <p id="advDoneSub" class="muted"></p>
      <div id="advDoneStats" class="adv-done-stats"></div>
      <div class="adv-footer"><button id="advDoneBtn" class="adv-btn big">FORTSÄTT</button></div>
    </section>
  </template>

  <!-- Inloggning -->
  <template id="tpl-login">
    <section class="login">
      <div id="loginCard" class="login-card">
        <div class="login-logo">Ñ</div>
        <h1>¡Hola!</h1>
        <p class="muted">Logga in för att öva. Alla som använder appen delar samma konto, så kort och framsteg syns på alla enheter.</p>
        <form id="loginForm" autocomplete="on">
          <label class="field">Lösenord
            <span class="pw-row">
              <input id="loginPw" type="password" autocomplete="current-password" spellcheck="false" autocapitalize="off">
              <button id="loginShow" type="button" class="btn-small" title="Visa/dölj lösenordet">👁</button>
            </span>
          </label>
          <button id="loginBtn" class="adv-btn big" type="submit">Logga in</button>
        </form>
        <p id="loginMsg" class="login-msg"></p>
      </div>
    </section>
  </template>

  <!-- Maskoten: inventory, butik och utmaningar -->
  <template id="tpl-mascot">
    <section class="mview">
      <div class="m-stage">
        <button id="mvFig" class="mascot stage-fig" title="Klappa"></button>
        <div class="m-stage-info">
          <button id="mvName" class="m-name" title="Byt namn"></button>
          <div class="coin-chip big" title="Dina mynt"><span>🪙</span><b id="mvCoins">0</b></div>
          <div id="mvSlots" class="inv-slots" aria-label="Utrustning"></div>
        </div>
      </div>
      <div id="mvBuy" class="buy-bar hidden"></div>
      <div class="chips mv-tabs" role="tablist">
        <button class="chip active" data-tab="inv">🎒 Inventory</button>
        <button class="chip" data-tab="shop">🛒 Butik</button>
        <button class="chip" data-tab="chal">🎯 Utmaningar</button>
      </div>
      <div id="mvBody" class="mv-body"></div>
    </section>
  </template>

  <template id="tpl-done">
    <section class="done">
      <div class="big">🎉</div>
      <h2>¡Muy bien!</h2>
      <p id="doneText"></p>
      <div class="row">
        <button id="btnAgain" class="btn good">Öva igen</button>
        <button id="btnBack" class="btn secondary">Tillbaka</button>
      </div>
    </section>
  </template>

  <script src="config.js"></script>
  <script src="version.js"></script>
  <script src="words.js"></script>
  <script src="verbs.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
  <script src="adventure.js"></script>
  <script src="mascot.js"></script>
  <script src="decks.js"></script>
  <script src="bg.js"></script>
  <script src="chat.js"></script>
  <script src="photo.js"></script>
  <script src="plan.js"></script>
  <script src="notes.js"></script>
</body>
</html>
